name: Checks

on:
  pull_request:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile --linker hoisted
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run build
      - run: bunx playwright install --with-deps chromium --only-shell
      - run: bun run test
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: subs-demo
          path: dist/demo
          if-no-files-found: error
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - run: docker compose config --quiet
      - run: docker build --progress=plain -t subs:check .
