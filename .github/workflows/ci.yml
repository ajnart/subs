name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile --linker hoisted
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run build
      - run: bunx playwright install --with-deps chromium
      - run: bun run test
